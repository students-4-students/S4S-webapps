stages: [build]

.build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -f $DOCKERFILE -t $CI_REGISTRY_IMAGE/$NAME:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY_IMAGE/$NAME:$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:api:
  extends: .build
  variables:
    NAME: api
    DOCKERFILE: apps/api/Dockerfile.api

build:connect:
  extends: .build
  variables:
    NAME: connect
    DOCKERFILE: apps/s4s-connect/Dockerfile.connect

build:gest4s:
  extends: .build
  variables:
    NAME: gest4s
    DOCKERFILE: apps/gest4s/Dockerfile.gest4s
